name: dokkan
description: "Dokkan Atelier - Curated Luxury Accessories"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_gen:
  output: lib/core/res/gen/

  integrations:
    image: true
    flutter_svg: true
    rive: false
    lottie: true
  fonts:
    enabled: false

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/