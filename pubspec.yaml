name: dokkan
description: "Dokkan Atelier - Curated Luxury Accessories"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6
  flutter_gen: ^5.15.0
  pull_to_refresh: ^2.0.0
  easy_refresh: ^4.0.0
  animated_visibility: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_gen:
  output: lib/core/res/gen/

  integrations:
    image: true
    flutter_svg: true
    rive: false
    lottie: true
  fonts:
    enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/inter/Inter-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/inter/Inter-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-ExtraBoldItalic.ttf
          weight: 800
          style: italic
